name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # parity compares against the commit in reports/parity.json

      - uses: pnpm/action-setup@v6 # version from packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check and build the catalogue
        run: pnpm build

      - name: Verify the packed packages
        run: pnpm verify:packages

      # The version merging this would publish, as release.yml picks it (written here, never committed),
      # so the dry run checks that version and not the one in package.json, which npm may already have.
      - name: Publish dry run
        run: node scripts/release-version.mjs && pnpm release:dry

      - uses: actions/upload-artifact@v7
        with:
          name: catalogue
          path: apps/catalogue/dist
          retention-days: 3
