name: Release

# Every push to main publishes @antfabric-ui/core, react and react-native to npm, at one shared
# version: the version in packages/core/package.json when npm does not have it yet and it is newer,
# otherwise the next patch after the newest on npm (scripts/release-version.mjs). Then the commit is
# tagged v<version> and a GitHub release is made. Nothing is committed back to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false # one release at a time, in push order

permissions:
  contents: write # push the tag, create the GitHub release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Pick the version
        id: version
        run: node scripts/release-version.mjs

      - name: Build and verify the packages
        run: pnpm build:packages && pnpm verify:packages

      # pnpm (not npm) publishes: only pnpm applies publishConfig (the dist exports) and turns
      # workspace:^ into a version range.
      - name: Publish to npm
        run: >-
          pnpm publish -r --access public --no-git-checks
          --filter @antfabric-ui/core --filter @antfabric-ui/react --filter @antfabric-ui/react-native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm refuses provenance for a private repository, so it is on only once the repo is public.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}

      - name: Tag and release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
